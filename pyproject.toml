[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.uv]
# Transitive security pins (pip-audit) — keep at or above fix versions.
# cryptography>=50.0.0 closes CVE-2026-69247 (PKCS#7 EnvelopedData decryption
# Bleichenbacher oracle via distinguishable errors/timing, introduced in 44.0.0)
# found in 49.0.0. No BACKWARDS INCOMPATIBLE changes in the 50.0.0 changelog;
# greeks-service has no direct `cryptography` import (transitive only).
override-dependencies = [
    "cryptography>=50.0.0,<51.0.0",
]

[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "G", "C901", "N802", "B008"]
ignore = ["E402", "F403", "F405", "G003", "G004", "G201", "G202", "UP035", "UP047", "F841"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "F841", "C901", "E501"]
"scripts/*" = ["F821", "C901", "E501"]

# Consolidated from the deleted pyrightconfig.json (2026-06-15) — toml is the single home
# (pyrightconfig.json silently OVERRODE this block; finding #2 of the QG config-SSOT audit).
# The json suppressed the reportAny/reportUnknown* family — which dodged STEP 5.21 (those rules
# MUST be "error" or omitted in [tool.basedpyright]). They cannot be relocated as-is, so this block
# is now the clean strict config (suppressions dropped, not masked). basedpyright surfaces the
# residual errors as WARN-ONLY today (no BASEDPYRIGHT_MAX_ERRORS ceiling set → STEP 4 warns, passes).
# RATCHET (P1, plan quality_gates_speed_and_config_ssot_2026_06_09.md): fix the residual strict
# errors, then set BASEDPYRIGHT_MAX_ERRORS=0 in scripts/quality-gates.sh to enforce the ceiling.
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["greeks_service"]
reportAny = "error"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
extraPaths = [
    "../unified-trading-library",
    "../unified-api-contracts",
]
exclude = ["tests", "**/__pycache__", ".venv*", "build", "dist", "node_modules"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "smoke: mark test as smoke test",
    "unit: mark test as unit test",
    "requires_credentials: skipped by default; run only when real GCP/AWS credentials are available",
]

[tool.coverage.run]
# pytest-cov + xdist: workers are separate processes; without parallel-combine the terminal
# fail-under reads PARTIAL (controller-only) data and spuriously fails (2026-06-22: mtds saw
# terminal 46.4% while coverage.xml correctly combined to 83.95%). parallel-combine fixes the gate.
parallel = true
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[project]
name = "greeks-service"
dynamic = ["version"]
description = "Greeks + carry-rate computation service writing to the PricingLedger SSOT"
readme = "README.md"
authors = [
    { name = "Ikenna Igboaka", email = "ikenna@odum-research.com" },
]
keywords = ["greeks", "options", "carry", "pricing-ledger", "trading-system"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "unified-trading-library>=0.72.0,<1.0.0",
    "unified-api-contracts>=0.95.0,<1.0.0",
    "fastapi>=0.137.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.12.5,<3.0.0",
]

[project.license]
text = "MIT"

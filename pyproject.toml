[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "G", "C901", "N802", "B008"]
ignore = ["E402", "F403", "F405", "G003", "G004", "G201", "G202", "UP035", "UP047", "F841"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "F841", "C901", "E501"]
"scripts/*" = ["F821", "C901", "E501"]

[tool.basedpyright]
typeCheckingMode = "strict"
reportAny = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportUnknownParameterType = "error"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "smoke: mark test as smoke test",
    "unit: mark test as unit test",
    "requires_credentials: skipped by default; run only when real GCP/AWS credentials are available",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[project]
name = "greeks-service"
version = "0.3.0"
description = "Greeks + carry-rate computation service writing to the PricingLedger SSOT"
readme = "README.md"
authors = [
    { name = "Ikenna Igboaka", email = "ikenna@odum-research.com" },
]
keywords = ["greeks", "options", "carry", "pricing-ledger", "trading-system"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "unified-trading-library>=0.5.0,<1.0.0",
    "unified-api-contracts>=0.7.0,<1.0.0",
    "fastapi<1.0.0,>=0.115.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.12.5,<3.0.0",
]

[project.license]
text = "MIT"
